[project]
name = "qq-mimic-bot"
version = "0.1.0"
description = "QQ群模仿机器人 - 基于NoneBot2"
requires-python = ">=3.9"
dependencies = [
    "nonebot2[fastapi]>=2.1.0",
    "nonebot-adapter-onebot>=2.3.0",
    "httpx>=0.25.0",
    "pydantic>=2.0.0",
]

[tool.nonebot]
adapters = [
    { name = "OneBot V11", module_name = "nonebot.adapters.onebot.v11" }
]
plugins = []
plugin_dirs = ["plugins"]
